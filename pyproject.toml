[project]
name = "sentinel-fx"
version = "0.1.0"
description = "Capital-preservation-first FX decision system: deterministic risk kernel, fail-closed decisions, auditable approvals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Sunitha" }]
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "tzdata>=2024.1",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "poethepoet>=0.29",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# ---------------------------------------------------------------- tasks
[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy"
imports = "lint-imports"
test = "pytest"
safety = "pytest -m invariant -q"
check = ["lint", "format-check", "typecheck", "imports", "test"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PT", "PL", "C4", "T20", "ERA", "BLE"]
ignore = [
    "PLR0913", # explicit keyword-only arguments are preferred over parameter objects in pure functions
    "PLR2004", # thresholds are named in the policy; literals in tests are intentional
    "N818",    # domain exceptions are named for what they mean (PolicyViolation, ExecutionRefused)
]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]
known-local-folder = ["safety", "support", "db"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "PLC0415"]
"src/sentinel/cli.py" = ["T201"]
# SQL there is assembled only from fixed identifier lists (roles, tables), never from input.
"migrations/**" = ["S608"]
"tests/db/**" = ["S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "migrations"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
markers = [
    "invariant(id): test enforces a named safety invariant from tests/safety/manifest.py",
    "db: needs PostgreSQL via SENTINEL_TEST_DATABASE_URL (applied automatically under tests/db)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------- import-linter (internal layering)
[tool.importlinter]
root_package = "sentinel"

[[tool.importlinter.contracts]]
name = "domain depends on nothing else in sentinel"
type = "forbidden"
source_modules = ["sentinel.domain"]
forbidden_modules = [
    "sentinel.fxmath", "sentinel.risk", "sentinel.decision", "sentinel.execution",
    "sentinel.audit", "sentinel.store", "sentinel.learning", "sentinel.perception",
    "sentinel.strategy", "sentinel.llm", "sentinel.api", "sentinel.bus", "sentinel.cli",
    "sentinel.indicators", "sentinel.backtest", "sentinel.explain", "sentinel.observability",
    "sentinel.config", "sentinel.schemas",
]

[[tool.importlinter.contracts]]
name = "fxmath depends only on domain"
type = "forbidden"
source_modules = ["sentinel.fxmath"]
forbidden_modules = [
    "sentinel.risk", "sentinel.decision", "sentinel.execution", "sentinel.audit",
    "sentinel.store", "sentinel.learning", "sentinel.perception", "sentinel.strategy",
    "sentinel.llm", "sentinel.api", "sentinel.bus", "sentinel.cli", "sentinel.indicators",
    "sentinel.backtest", "sentinel.explain", "sentinel.observability", "sentinel.config",
    "sentinel.schemas",
]

[[tool.importlinter.contracts]]
name = "risk kernel depends only on domain and fxmath"
type = "forbidden"
source_modules = ["sentinel.risk"]
forbidden_modules = [
    "sentinel.decision", "sentinel.execution", "sentinel.audit", "sentinel.store",
    "sentinel.learning", "sentinel.perception", "sentinel.strategy", "sentinel.llm",
    "sentinel.api", "sentinel.bus", "sentinel.cli", "sentinel.indicators",
    "sentinel.backtest", "sentinel.explain", "sentinel.observability", "sentinel.config",
    "sentinel.schemas",
]

[[tool.importlinter.contracts]]
name = "audit chain depends only on domain"
type = "forbidden"
source_modules = ["sentinel.audit"]
forbidden_modules = [
    "sentinel.fxmath", "sentinel.risk", "sentinel.decision", "sentinel.execution",
    "sentinel.store", "sentinel.learning", "sentinel.perception", "sentinel.strategy",
    "sentinel.llm", "sentinel.api", "sentinel.bus", "sentinel.cli", "sentinel.config",
    "sentinel.schemas",
]

[[tool.importlinter.contracts]]
name = "boundary schemas cannot reach trading state, policy writers or execution"
type = "forbidden"
source_modules = ["sentinel.schemas"]
forbidden_modules = [
    "sentinel.risk", "sentinel.decision", "sentinel.execution", "sentinel.store",
    "sentinel.learning", "sentinel.config",
]

[[tool.importlinter.contracts]]
name = "learning cannot reach policy governance, persistence or execution"
type = "forbidden"
source_modules = ["sentinel.learning"]
forbidden_modules = [
    "sentinel.risk.governance", "sentinel.risk.state_machine", "sentinel.store",
    "sentinel.execution", "sentinel.decision", "sentinel.config",
]

[[tool.importlinter.contracts]]
name = "market-data ingestion cannot reach decisions, policy writers or execution"
type = "forbidden"
source_modules = ["sentinel.perception.market_data"]
forbidden_modules = [
    "sentinel.decision", "sentinel.execution", "sentinel.risk.governance",
    "sentinel.risk.kernel", "sentinel.store", "sentinel.learning", "sentinel.llm",
]

[[tool.importlinter.contracts]]
name = "LLM layer cannot reach trading state, policy or execution"
type = "forbidden"
source_modules = ["sentinel.llm", "sentinel.perception.news"]
forbidden_modules = [
    "sentinel.risk", "sentinel.decision", "sentinel.execution", "sentinel.store",
]
