[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The URL comes from SENTINEL_DATABASE_URL (or -x url=...). Never commit credentials.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
