name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly deep property run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  HYPOTHESIS_PROFILE: ci

jobs:
  static:
    name: lint, format, types, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

  tests:
    # Everything that does not need PostgreSQL, on both operating systems. The coverage
    # gate runs in the `database` job, which executes the complete suite.
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -m "not db" -q

  database:
    # Complete suite against PostgreSQL 16, with the coverage gate. SENTINEL_REQUIRE_DB=1
    # turns an unreachable database into a failure instead of a skip.
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SENTINEL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: migrations apply, roll back and re-apply cleanly
        env:
          SENTINEL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: complete suite with coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  safety:
    name: safety invariants (must exist and pass)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SENTINEL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      # Runs only tests marked @pytest.mark.invariant. tests/safety/test_manifest.py fails
      # if any invariant listed in tests/safety/manifest.py has no marked test, so an
      # invariant cannot be dropped silently by deleting its tests.
      - run: uv run pytest -m invariant -q

  deep-properties:
    name: deep property run (nightly, 5000 examples)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HYPOTHESIS_PROFILE: deep
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/property tests/safety -q
